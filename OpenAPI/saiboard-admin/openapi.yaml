        "/app/saiboard/admin/Screen/generateFromTable": {
            "post": {
                "tags": [
                    "saiboard-admin.SAI Board.ScreenController"
                ],
                "summary": "从数据表生成大屏",
                "description": "",
                "parameters": [
                    {
                        "name": "Authorization",
                        "in": "header",
                        "required": true,
                        "type": "string",
                        "description": "身份令牌Token"
                    }
                ],
                "requestBody": {
                    "required": true,
                    "description": "",
                    "content": {
                        "application/json": {
                            "schema": {
                                "type": "object",
                                "properties": {
                                    "datasource_id": {
                                        "type": "integer",
                                        "description": "MySQL 数据源ID",
                                        "format": "int32"
                                    },
                                    "table": {
                                        "type": "string",
                                        "description": "数据表名"
                                    },
                                    "name": {
                                        "type": "string",
                                        "description": "大屏名称"
                                    },
                                    "width": {
                                        "type": "integer",
                                        "description": "设计宽度",
                                        "format": "int32"
                                    },
                                    "height": {
                                        "type": "integer",
                                        "description": "设计高度",
                                        "format": "int32"
                                    },
                                    "chart_types": {
                                        "type": "array",
                                        "description": "生成模块：count/trend/rank/distribution/status/raw",
                                        "items": {
                                            "type": "string"
                                        }
                                    },
                                    "date_field": {
                                        "type": "string",
                                        "description": "趋势时间字段"
                                    },
                                    "metric_field": {
                                        "type": "string",
                                        "description": "聚合指标字段，留空为计数"
                                    },
                                    "label_field": {
                                        "type": "string",
                                        "description": "排行维度字段，也作为状态矩阵名称字段"
                                    },
                                    "category_field": {
                                        "type": "string",
                                        "description": "分布维度字段"
                                    },
                                    "status_field": {
                                        "type": "string",
                                        "description": "状态矩阵状态字段，需与名称字段不同"
                                    },
                                    "order_field": {
                                        "type": "string",
                                        "description": "明细排序字段"
                                    },
                                    "raw_fields": {
                                        "type": "array",
                                        "description": "明细表字段，最多8个",
                                        "items": {
                                            "type": "string"
                                        }
                                    }
                                },
                                "required": [
                                    "datasource_id",
                                    "table"
                                ]
                            }
                        }
                    }
                },
                "responses": {
                    "200": {
                        "description": "请求成功",
                        "content": {
                            "application/json": {
                                "schema": {
                                    "type": "object",
                                    "properties": {
                                        "id": {
                                            "type": "integer",
                                            "description": "生成的大屏ID",
                                            "format": "int32"
                                        },
                                        "name": {
                                            "type": "string",
                                            "description": "生成的大屏名称"
                                        },
                                        "table": {
                                            "type": "string",
                                            "description": "来源数据表"
                                        },
                                        "chart_types": {
                                            "type": "array",
                                            "description": "实际生成的模块类型",
                                            "items": {
                                                "type": "string"
                                            }
                                        },
                                        "template_ids": {
                                            "type": "array",
                                            "description": "自动生成的查询模板ID列表",
                                            "items": {
                                                "type": "string"
                                            }
                                        },
                                        "component_count": {
                                            "type": "integer",
                                            "description": "自动生成的组件数量",
                                            "format": "int32"
                                        }
                                    }
                                }
                            }
                        }
                    },
                    "401": {
                        "description": "登录令牌无效"
                    }
                }
            }
        },
